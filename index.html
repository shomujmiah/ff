<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Fantasy Premier League</title>
  
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="IMG_9596.jpeg">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FPL">
  <link rel="icon" type="image/png" href="IMG_9596.jpeg">
  
  <!-- OneSignal SDK Integration -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    window.OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: "4d1e2989-a304-468b-9a77-7fef97ade3c6",
        });
        console.log("DIAGNOSTIC: OneSignal Initialized Successfully!");

        // Check subscription status
        const isOptedIn = OneSignal.User.PushSubscription.optedIn;
        console.log("DIAGNOSTIC: User opted in status:", isOptedIn);

        if (!isOptedIn) {
          // Force prompt display for diagnostics
          await OneSignal.Slidedown.promptPush();
        }
      } catch (error) {
        console.error("DIAGNOSTIC: OneSignal Initialization Failed:", error);
      }
    });
  </script>

  <style>
    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background-color: #fdfbf7;
    }
    iframe {
      width: 100%; height: 100%; border: none; display: block;
    }
  </style>
</head>
